# 테마(jekyll-theme-chirpy)의 ko-KR 문구 중 바꾸고 싶은 것만 적는다.
# Jekyll이 테마 _data와 깊게 합치므로 나머지 문구는 테마 값을 그대로 쓴다.

panel:
  toc: 목차

# 글 하단 라이선스 문구("이 기사는 저작권자의 CC BY 4.0 …")를 숨긴다.
# 빈 문자열("")은 Liquid에서 참이고 null은 깊은 병합에서 테마 값이 남으므로 false를 쓴다.
copyright:
  license:
    template: false

# 푸터 오른쪽 "Powered by Jekyll with Chirpy theme" 문구를 숨긴다.
# 테마가 if 없이 replace 필터로 출력하므로 false면 "false"가 찍힌다. 빈 문자열을 쓴다.
meta: ""

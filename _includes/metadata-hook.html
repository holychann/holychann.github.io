{% comment %}
  데스크톱 사이드바: 메뉴의 링크를 눌러 다른 페이지로 가도, 마우스가 메뉴 위에 있는 동안은 펼친 채로 둔다.
  (페이지가 바뀌면 브라우저가 마우스를 다시 움직일 때까지 :hover를 잃어 메뉴가 접혀 버리기 때문)
  링크를 누를 때 sessionStorage에 표시를 남기고, 다음 페이지에서 html.sidebar-keep으로 바로 펼친다.
  마우스가 메뉴 밖으로 나가면 표시를 지워 평소처럼 접힌다.
{% endcomment %}
<script>
  (function () {
    var KEY = 'sidebar-keep';
    var root = document.documentElement;
    var desktop = window.matchMedia('(min-width: 850px)');

    try {
      var clickedAt = Number(sessionStorage.getItem(KEY));
      sessionStorage.removeItem(KEY);
      if (clickedAt && Date.now() - clickedAt < 10000 && desktop.matches) {
        root.classList.add(KEY);
      }
    } catch (e) {}

    document.addEventListener('DOMContentLoaded', function () {
      var sidebar = document.getElementById('sidebar');
      if (!sidebar) return;

      sidebar.addEventListener('click', function (e) {
        var link = e.target.closest('a[href]');
        if (!link || !desktop.matches) return;
        if (link.target === '_blank' || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        if (link.origin !== location.origin) return;
        try {
          sessionStorage.setItem(KEY, String(Date.now()));
        } catch (err) {}
      });

      if (!root.classList.contains(KEY)) return;

      function release() {
        root.classList.remove(KEY);
        document.removeEventListener('mousemove', onMove);
        sidebar.removeEventListener('mouseleave', release);
      }

      function onMove(e) {
        if (!sidebar.contains(e.target)) release();
      }

      document.addEventListener('mousemove', onMove);
      sidebar.addEventListener('mouseleave', release);
    });
  })();
</script>
